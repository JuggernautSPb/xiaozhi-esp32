name: Build Syoma (stock + pet, 128x64, ru-RU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка, тег или коммит (по умолчанию main)'
        required: false
        default: 'main'
      what:
        description: 'Что собирать: both – обе, pet – только Сёма, stock – только сток'
        type: choice
        options:
          - both
          - pet
          - stock
        default: both

jobs:
  build:
    if: inputs.what == 'both' || inputs.what == 'stock'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build stock firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python3 scripts/build.py bread-compact-wifi \
            --name bread-compact-wifi-128x64 \
            --language ru-RU \
            --wake-word disabled

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: syoma-stock-bread-compact-wifi-128x64
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
          retention-days: 14

  pet:
    if: inputs.what == 'both' || inputs.what == 'pet'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Syoma pet firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python3 scripts/build.py syoma-pet \
            --name syoma-pet \
            --language ru-RU \
            --wake-word disabled

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: syoma-pet-128x64
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
          retention-days: 14